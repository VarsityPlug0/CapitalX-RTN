<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject|default:"CapitalX" }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background-color: #050810;
            color: #cbd5e1;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        .email-wrapper {
            padding: 48px 16px;
        }

        .email-container {
            max-width: 680px;
            margin: 0 auto;
            background-color: #0d1117;
            border: 1px solid #1e2538;
            border-radius: 16px;
            overflow: hidden;
        }

        /* Header */
        .email-header {
            background: linear-gradient(135deg, #0d1117 0%, #111520 100%);
            border-bottom: 1px solid #1e2538;
            padding: 48px 56px 40px;
            text-align: center;
        }

        .logo-mark {
            display: inline-block;
            width: 48px;
            height: 48px;
            background: #2563eb;
            border-radius: 12px;
            line-height: 48px;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .logo-text {
            font-size: 26px;
            font-weight: 800;
            color: #f1f5f9;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .logo-text span {
            color: #3b82f6;
        }

        .tagline {
            font-size: 13px;
            color: #8b9cb3;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* Content */
        .email-content {
            padding: 52px 56px;
        }

        .greeting {
            font-size: 20px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .main-content {
            font-size: 15px;
            color: #cbd5e1;
            line-height: 1.8;
            margin-bottom: 32px;
        }

        .main-content p {
            margin-bottom: 16px;
        }

        /* Divider */
        .divider {
            border: none;
            border-top: 1px solid #1e2538;
            margin: 36px 0;
        }

        /* Button */
        .btn-wrap {
            text-align: center;
            margin: 36px 0;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: #2563eb;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.2px;
        }

        .btn-green {
            background: #10b981;
        }

        .btn-red {
            background: #ef4444;
        }

        /* Info box */
        .info-box {
            background: #111520;
            border: 1px solid #1e2538;
            border-left: 3px solid #2563eb;
            border-radius: 10px;
            padding: 24px 28px;
            margin: 28px 0;
        }

        .info-box h3 {
            font-size: 13px;
            font-weight: 600;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 14px;
        }

        .info-box p {
            font-size: 14px;
            color: #8b9cb3;
            margin-bottom: 6px;
            line-height: 1.6;
        }

        /* Amount */
        .amount {
            font-size: 32px;
            font-weight: 800;
            color: #3b82f6;
            letter-spacing: -1px;
            display: block;
            margin: 8px 0 4px;
        }

        .amount-label {
            font-size: 12px;
            color: #8b9cb3;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* Table */
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
        }

        .info-table tr:not(:last-child) td {
            border-bottom: 1px solid #1e2538;
        }

        .info-table td {
            padding: 14px 4px;
            font-size: 14px;
            vertical-align: top;
        }

        .info-table .label {
            color: #8b9cb3;
            font-weight: 500;
            width: 42%;
        }

        .info-table .value {
            color: #f1f5f9;
            font-weight: 500;
        }

        /* Status badges */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-green  { background: rgba(16,185,129,.15); color: #10b981; }
        .badge-yellow { background: rgba(245,158,11,.15);  color: #f59e0b; }
        .badge-red    { background: rgba(239,68,68,.15);   color: #ef4444; }
        .badge-blue   { background: rgba(59,130,246,.15);  color: #3b82f6; }

        /* Footer */
        .email-footer {
            background: #080b12;
            border-top: 1px solid #1e2538;
            padding: 36px 56px;
            text-align: center;
        }

        .footer-links {
            margin-bottom: 20px;
        }

        .footer-links a {
            color: #8b9cb3;
            text-decoration: none;
            margin: 0 14px;
            font-size: 13px;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #3b82f6;
        }

        .footer-divider {
            width: 40px;
            border: none;
            border-top: 1px solid #1e2538;
            margin: 20px auto;
        }

        .disclaimer {
            font-size: 12px;
            color: #4a5568;
            line-height: 1.7;
        }

        .disclaimer p { margin-bottom: 4px; }

        /* Responsive */
        @media only screen and (max-width: 620px) {
            .email-wrapper { padding: 0 !important; }
            .email-container { border-radius: 0 !important; border-left: none !important; border-right: none !important; }
            .email-header  { padding: 36px 24px 28px !important; }
            .email-content { padding: 36px 24px !important; }
            .email-footer  { padding: 28px 24px !important; }
            .btn { display: block !important; text-align: center !important; padding: 16px 24px !important; }
            .footer-links a { display: inline-block; margin: 6px 8px !important; }
            .amount { font-size: 26px !important; }
        }
    </style>
</head>
<body>
<div class="email-wrapper">
    <div class="email-container">

        <!-- Header -->
        <div class="email-header">
            <div class="logo-mark">CX</div>
            <div class="logo-text">Capital<span>X</span></div>
            <div class="tagline">Your Gateway to Smart Investments</div>
        </div>

        <!-- Content -->
        <div class="email-content">
            {% block content %}{% endblock %}
        </div>

        <!-- Footer -->
        <div class="email-footer">
            <div class="footer-links">
                <a href="{{ site_url|default:'https://safechain.cc' }}">Home</a>
                <a href="{{ site_url|default:'https://safechain.cc' }}/dashboard">Dashboard</a>
                <a href="{{ site_url|default:'https://safechain.cc' }}/contact">Contact</a>
                <a href="{{ site_url|default:'https://safechain.cc' }}/support">Support</a>
            </div>
            <hr class="footer-divider">
            <div class="disclaimer">
                <p>This email was sent to {{ user.email }} from CapitalX.</p>
                <p>If you have questions, visit <a href="https://safechain.cc/support" style="color:#3b82f6;text-decoration:none;">safechain.cc/support</a></p>
                <p style="margin-top:8px;">&copy; 2025 CapitalX. All rights reserved.</p>
            </div>
        </div>

    </div>
</div>
</body>
</html>
