{% extends "core/base.html" %}
{% block title %}Live Support — CapitalX{% endblock %}

{% block extra_css %}
<style>
.support-wrap {
  max-width: 680px;
  margin: 2rem auto;
  display: flex;
  flex-direction: column;
  height: calc(100vh - 140px);
}
.support-header {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid #2d2d4e;
  border-radius: 16px 16px 0 0;
  padding: 1.25rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 12px;
}
.support-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00ff88, #0099ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
}
.support-status {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #00ff88;
  display: inline-block;
  margin-right: 5px;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.messages-area {
  flex: 1;
  overflow-y: auto;
  background: #0d0d1a;
  border-left: 1px solid #2d2d4e;
  border-right: 1px solid #2d2d4e;
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.msg {
  max-width: 75%;
  padding: .65rem 1rem;
  border-radius: 16px;
  font-size: .9rem;
  line-height: 1.5;
  word-break: break-word;
}
.msg.client {
  background: linear-gradient(135deg, #1a3a5c, #1e4976);
  border: 1px solid #2563eb44;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.msg.admin {
  background: #1a1a2e;
  border: 1px solid #2d2d4e;
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}
.msg .meta {
  font-size: .7rem;
  color: #6e7681;
  margin-top: 4px;
  text-align: right;
}
.msg.admin .meta { text-align: left; }

.input-area {
  background: #111118;
  border: 1px solid #2d2d4e;
  border-top: none;
  border-radius: 0 0 16px 16px;
  padding: 1rem 1.25rem;
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
.input-area textarea {
  flex: 1;
  background: #0d0d1a;
  border: 1px solid #2d2d4e;
  border-radius: 12px;
  color: #c9d1d9;
  padding: .65rem 1rem;
  font-size: .9rem;
  resize: none;
  min-height: 44px;
  max-height: 120px;
  outline: none;
  transition: border-color .2s;
}
.input-area textarea:focus { border-color: #00ff88; }
.input-area textarea::placeholder { color: #6e7681; }
.send-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00ff88, #0099ff);
  border: none;
  color: #000;
  font-size: 1.1rem;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .15s;
}
.send-btn:hover { transform: scale(1.08); }
.send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #6e7681;
  gap: 10px;
}
.empty-state i { font-size: 2.5rem; color: #2d2d4e; }
</style>
{% endblock %}

{% block content %}
<div class="support-wrap">
  <div class="support-header">
    <div class="support-avatar">🎧</div>
    <div>
      <div style="font-weight:700;font-size:1rem;">CapitalX Support</div>
      <div style="font-size:.8rem;color:#6e7681;">
        <span class="support-status"></span>Online — we reply within minutes
      </div>
    </div>
  </div>

  <div class="messages-area" id="msgArea">
    <div class="empty-state" id="emptyState">
      <i class="bi bi-chat-dots"></i>
      <div>Send a message to start the conversation</div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="msgInput" placeholder="Type your message..." rows="1"
              onkeydown="handleKey(event)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <i class="bi bi-send-fill"></i>
    </button>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const CSRF = '{{ csrf_token }}';
let lastCount = 0;

function scrollBottom() {
  const a = document.getElementById('msgArea');
  a.scrollTop = a.scrollHeight;
}

function renderMessages(msgs) {
  const area = document.getElementById('msgArea');
  const empty = document.getElementById('emptyState');
  if (!msgs.length) { empty.style.display = 'flex'; return; }
  empty.style.display = 'none';

  // Only re-render if count changed
  if (msgs.length === lastCount) return;
  lastCount = msgs.length;

  // Keep empty state element, rebuild rest
  const existingMsgs = area.querySelectorAll('.msg');
  existingMsgs.forEach(m => m.remove());

  msgs.forEach(m => {
    const div = document.createElement('div');
    div.className = `msg ${m.sender}`;
    div.innerHTML = `${escHtml(m.message)}<div class="meta">${m.sender === 'admin' ? '🎧 Support' : 'You'} · ${m.time}</div>`;
    area.appendChild(div);
  });
  scrollBottom();
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

async function fetchHistory() {
  try {
    const r = await fetch('/api/support/history/');
    const d = await r.json();
    if (d.success) renderMessages(d.messages);
  } catch(e) {}
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const btn   = document.getElementById('sendBtn');
  const text  = input.value.trim();
  if (!text) return;

  input.value = '';
  btn.disabled = true;

  try {
    const r = await fetch('/api/support/send/', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': CSRF},
      body: JSON.stringify({message: text})
    });
    const d = await r.json();
    if (d.success) fetchHistory();
  } catch(e) {}

  btn.disabled = false;
  input.focus();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// Auto-resize textarea
document.getElementById('msgInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

fetchHistory();
setInterval(fetchHistory, 4000);
</script>
{% endblock %}
