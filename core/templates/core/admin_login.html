{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CapitalX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --dark-bg: #0d0f12;
            --card-bg: #1a1d21;
            --border: #2d3238;
            --text: #e9ecef;
            --muted: #6c757d;
            --primary: #0d6efd;
        }
        * { font-family: 'Inter', system-ui, sans-serif; box-sizing: border-box; }
        body {
            background: var(--dark-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }
        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
        }
        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            background: rgba(13,110,253,.15);
            border: 1px solid rgba(13,110,253,.3);
            color: #6ea8fe;
            border-radius: 20px;
            padding: .3rem .9rem;
            font-size: .75rem;
            font-weight: 600;
            letter-spacing: .05em;
            text-transform: uppercase;
            margin-bottom: 1.25rem;
        }
        .logo { font-size: 1.75rem; font-weight: 800; color: var(--text); margin-bottom: .25rem; }
        .logo span { color: var(--primary); }
        .subtitle { color: var(--muted); font-size: .875rem; margin-bottom: 2rem; }
        .form-control {
            background: #0d0f12;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: .75rem 1rem;
        }
        .form-control:focus {
            background: #0d0f12;
            border-color: var(--primary);
            color: var(--text);
            box-shadow: 0 0 0 3px rgba(13,110,253,.2);
        }
        .form-label { color: var(--muted); font-size: .8125rem; font-weight: 500; margin-bottom: .4rem; }
        .btn-admin {
            width: 100%;
            padding: .8rem;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            font-size: .9375rem;
            cursor: pointer;
            transition: background .15s;
            margin-top: .5rem;
        }
        .btn-admin:hover { background: #0b5ed7; }
        .divider { border-color: var(--border); margin: 1.5rem 0; }
        .client-link {
            text-align: center;
            color: var(--muted);
            font-size: .8125rem;
        }
        .client-link a { color: var(--primary); text-decoration: none; }
        .client-link a:hover { text-decoration: underline; }
        .alert-danger { background: rgba(220,53,69,.15); border-color: rgba(220,53,69,.3); color: #ea868f; border-radius: 8px; font-size: .875rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="admin-badge"><i class="bi bi-shield-lock-fill"></i> Admin Portal</div>
        <div class="logo">Capital<span>X</span></div>
        <div class="subtitle">Sign in to the administration console</div>

        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-danger mb-3">
                <i class="bi bi-exclamation-triangle me-2"></i>{{ message }}
            </div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'admin_login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" name="email" class="form-control" placeholder="admin@capitalx.co.za" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-admin">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Admin
            </button>
        </form>

        <hr class="divider">
        <div class="client-link">
            Not an admin? <a href="{% url 'login' %}">Go to client login</a>
        </div>
    </div>
</body>
</html>
